name: C3C Single Security Validation
on:
  push:
    branches: [review/c3c-security-validation-20261017]
permissions:
  contents: read
concurrency:
  group: c3c-single-security-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.run_attempt == 1 && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify publication and workflow safety
        run: python validation/c3c/run.py --safety
      - name: Run bounded native validation and print evidence
        run: timeout --signal=TERM --kill-after=30s 1050s python -u validation/c3c/run.py --execute
