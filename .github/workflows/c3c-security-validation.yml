name: C3C Single Security Validation
on:
  push:
    branches: [review/c3c-security-validation-20261017]
permissions:
  contents: read
concurrency:
  group: c3c-single-security-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.run_attempt == 1 && github.event.deleted == false && github.event.repository.private == false && github.event.before == '89ac410c49b036c3866be411c57079a4b90af9ab'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      C3C_POLICY_JOB: ${{ github.run_id }}-${{ github.run_attempt }}
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - timeout-minutes: 1
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify publication and workflow safety
        timeout-minutes: 1
        run: |
          python -m unittest discover -s validation/c3c -p test_preflight.py -v
          python -m unittest validation.c3c.sandbox_policy.test_policy validation.c3c.test_policy_attachment -v
          python validation/c3c/run.py --safety
      - name: Verify structural capabilities and add only the job-owned named profile
        run: >-
          timeout --signal=TERM --kill-after=5s 60s sudo -n -- /usr/bin/python3 -I
          "$GITHUB_WORKSPACE/validation/c3c/policy_attachment.py" --prepare-job "$C3C_POLICY_JOB"
      - name: Run bounded native validation and print evidence
        run: timeout --signal=TERM --kill-after=30s 780s python -u validation/c3c/run.py --execute
      - name: Remove only this job's recorded containers, volumes and image references
        if: always()
        run: timeout --signal=TERM --kill-after=5s 60s python -u validation/c3c/run.py --cleanup
      - name: Remove only the receipted named policy and verify host defaults
        if: always()
        run: >-
          timeout --signal=TERM --kill-after=5s 60s sudo -n -- /usr/bin/python3 -I
          "$GITHUB_WORKSPACE/validation/c3c/policy_attachment.py" --cleanup-job "$C3C_POLICY_JOB"
